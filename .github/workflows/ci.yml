name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Backend tests and frontend syntax
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: backend
      APP_ENV: test
      DEBUG: "false"
      DATABASE_URL: sqlite:////tmp/icampus-ci.db
      JWT_SECRET_KEY: ci-only-secret-with-at-least-32-characters
      DEEPSEEK_API_KEY: ci-placeholder-no-external-calls
      LLM_BASE_URL: http://127.0.0.1:9
      DEMO_ACCOUNT_ENABLED: "false"
      LOG_DIR: /tmp/icampus-logs

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt

      - name: Install backend and test dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q backend

      - name: Run backend tests
        run: python -m pytest backend/tests -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run frontend V2 contracts
        run: node tests/frontend_v2_contracts.js

      - name: Check available frontend JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for frontend_dir in miniprogram miniprogram-v2; do
            if [ -d "$frontend_dir" ]; then
              find "$frontend_dir" -type f -name '*.js' -print0 \
                | xargs -0 -r -n 1 node --check
            fi
          done

  postgres-migrations:
    name: PostgreSQL migration round trip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
        env:
          POSTGRES_DB: icampus
          POSTGRES_USER: icampus
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U icampus -d icampus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PYTHONPATH: backend
      APP_ENV: test
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://icampus:ci-postgres-password@127.0.0.1:5432/icampus
      JWT_SECRET_KEY: ci-only-secret-with-at-least-32-characters
      DEEPSEEK_API_KEY: ci-placeholder-no-external-calls
      LLM_BASE_URL: http://127.0.0.1:9
      DEMO_ACCOUNT_ENABLED: "false"
      LOG_DIR: /tmp/icampus-logs
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Upgrade PostgreSQL to head
        run: python -m alembic -c backend/alembic.ini upgrade head

      - name: Verify ORM and migration agree
        run: python -m alembic -c backend/alembic.ini check

      - name: Exercise migration rollback and reapply
        run: |
          python -m alembic -c backend/alembic.ini downgrade base
          python -m alembic -c backend/alembic.ini upgrade head
