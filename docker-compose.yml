name: icampus

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    ports:
      - "8000:8000"
    environment:
      APP_NAME: ${APP_NAME:-iCampus}
      APP_ENV: ${APP_ENV:-dev}
      DEBUG: ${DEBUG:-false}
      HOST: 0.0.0.0
      PORT: "8000"
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/icampus.db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-icampus-dev-secret-change-in-production}
      LOG_DIR: /app/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      DEMO_ACCOUNT_ENABLED: ${DEMO_ACCOUNT_ENABLED:-true}
    volumes:
      - icampus-data:/app/data
      - icampus-logs:/app/logs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

volumes:
  icampus-data:
  icampus-logs:
